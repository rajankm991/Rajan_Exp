<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashflow Ledger — Rajan's Finance Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10151F;
    --ink-2:#171F2E;
    --paper:#F5F2EA;
    --card:#FFFFFF;
    --card-line:#E7E1D2;
    --brass:#B8862E;
    --brass-dark:#8C6621;
    --brass-tint:#F4E9D3;
    --green:#1F7A5C;
    --green-tint:#E1EFE8;
    --red:#B23A48;
    --red-tint:#F6E4E6;
    --purple:#6B4E9E;
    --purple-tint:#EBE4F4;
    --ink-text:#1B2333;
    --muted:#7C7460;
    --muted-cool:#6E7686;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink-text);
    -webkit-font-smoothing:antialiased;
  }
  .main{ max-width:1560px; margin:0 auto; padding:24px 26px 50px; }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:16px; }
  .topbar h1{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0 0 4px; letter-spacing:-0.01em; }
  .topbar .tag{ font-size:12.5px; color:var(--muted); }
  .backlink{
    display:inline-flex; align-items:center; gap:7px; background:var(--ink); color:#F3EFE4;
    border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; text-decoration:none;
    white-space:nowrap;
  }
  .backlink:hover{ background:var(--ink-2); }

  .data-status{ font-size:12px; padding:9px 14px; border-radius:8px; margin-bottom:16px; border:1px solid transparent; }
  .data-status.demo{ background:var(--brass-tint); color:var(--brass-dark); border-color:#E8D5A8; }
  .data-status.live{ background:var(--green-tint); color:var(--green); border-color:#BFE0CE; }
  .data-status.error{ background:var(--red-tint); color:var(--red); border-color:#E8C1C6; }
  .data-status code{ font-family:'IBM Plex Mono',monospace; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
  .kpi{ background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:14px 16px 12px; position:relative; overflow:hidden; box-shadow:0 1px 2px rgba(20,20,10,0.04); }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .kpi.c-given::before{ background:var(--red); }
  .kpi.c-received::before{ background:var(--green); }
  .kpi.c-net::before{ background:var(--brass); }
  .kpi.c-count::before{ background:#1B7F86; }
  .kpi .lbl{ font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted-cool); font-weight:700; margin-bottom:6px; }
  .kpi .num{ font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; color:var(--ink-text); letter-spacing:-0.01em; }

  .toolbar{
    background:var(--card); border:1px solid var(--card-line); border-radius:12px;
    padding:14px 16px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(20,20,10,0.04);
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted-cool); font-weight:700; }
  .field select, .field input{
    border:1px solid var(--card-line); border-radius:8px; padding:8px 10px; font-family:'Inter',sans-serif;
    font-size:13px; color:var(--ink-text); background:#fff; outline:none; min-width:160px;
  }
  .field input[type="text"]{ min-width:220px; }
  .field select:focus, .field input:focus{ border-color:var(--brass); }
  .countInfo{ margin-left:auto; font-size:12.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; align-self:center; }

  .panel{ background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:0; overflow:hidden; box-shadow:0 1px 2px rgba(20,20,10,0.04); }
  /* table-layout:fixed + explicit per-column widths keep every column readably wide —
     Notes/Name get the most room, and content wraps in full (word-break) instead of
     ever being clipped or squeezed by narrower neighbour columns. */
  table.txn-table{ width:100%; border-collapse:collapse; font-size:12.8px; table-layout:fixed; }
  table.txn-table th{
    text-align:left; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    color:#fff; background:var(--ink); padding:10px 12px; font-weight:600; cursor:pointer; user-select:none;
    white-space:nowrap; position:sticky; top:0; z-index:1; overflow:hidden; text-overflow:ellipsis;
  }
  table.txn-table th.amtcol{ text-align:right; }
  table.txn-table th .arrow{ opacity:.55; font-size:9px; margin-left:3px; }
  table.txn-table td{ padding:10px 12px; border-bottom:1px solid var(--card-line); vertical-align:middle; white-space:normal; word-break:break-word; overflow-wrap:anywhere; }
  table.txn-table tbody tr:hover{ background:#FAF7EE; }
  table.txn-table td.amt{ text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:600; white-space:nowrap; }
  table.txn-table td.amt.pos{ color:var(--green); }
  table.txn-table td.amt.neg{ color:var(--red); }
  table.txn-table tr:last-child td{ border-bottom:none; }
  /* Column widths — Date/Type/Amount stay compact; Notes carries the most text so it
     gets the most space, Name/Category get comfortable room too. */
  table.txn-table th:nth-child(1), table.txn-table td:nth-child(1){ width:9%; }
  table.txn-table th:nth-child(2), table.txn-table td:nth-child(2){ width:17%; }
  table.txn-table th:nth-child(3), table.txn-table td:nth-child(3){ width:10%; }
  table.txn-table th:nth-child(4), table.txn-table td:nth-child(4){ width:14%; }
  table.txn-table th:nth-child(5), table.txn-table td:nth-child(5){ width:36%; }
  table.txn-table th:nth-child(6), table.txn-table td:nth-child(6){ width:14%; }
  .type-pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .type-pill.Given{ background:var(--red-tint); color:var(--red); }
  .type-pill.Received{ background:var(--green-tint); color:var(--green); }
  .emptyRow{ text-align:center; color:var(--muted); padding:30px !important; }


  @media (max-width:1200px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:760px){
    .toolbar{ flex-direction:column; align-items:stretch; }
    .countInfo{ margin-left:0; }
    table.txn-table{ table-layout:auto; }
    table.txn-table th, table.txn-table td{ white-space:nowrap; }
    .panel{ overflow-x:auto; }
  }
</style>
<script src="auth-config.js"></script>
<!-- data.js embeds the live data as window.EMBEDDED_DATA — a plain <script> tag, so it
     loads the same way whether this page is opened online or straight from disk
     (fetch() of a local data.json is blocked by browsers over file://). -->
<script src="data.js"></script>
</head>
<body>
<div id="pwGate" style="position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:30px 32px;max-width:340px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center;">
    <div style="font-size:30px;margin-bottom:8px;">🔒</div>
    <h2 style="font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 6px;color:var(--ink-text);">Protected Page</h2>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px;">Enter the password to view this data.</p>
    <input type="password" id="pwInput" placeholder="Password" style="width:100%;padding:10px 12px;border:1px solid var(--card-line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:10px;outline:none;box-sizing:border-box;">
    <button type="button" id="pwSubmit" style="width:100%;background:var(--ink);color:#F3EFE4;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;">Unlock</button>
    <div id="pwErr" style="color:var(--red);font-size:12px;margin-top:10px;min-height:14px;"></div>

  </div>
</div>
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="logo.gif" alt="Logo" style="height:32px;width:32px;border-radius:8px;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none'">
      <div>
        <h1>Cashflow Ledger</h1>
        <div class="tag">Every Given / Received row from the Cashflow sheet — per lender, searchable &amp; sortable</div>
      </div>
    </div>
    <a class="backlink" href="./">← Back to Dashboard</a>
  </div>

  <div id="dataStatus" class="data-status demo">Loading…</div>

  <div class="kpi-row">
    <div class="kpi c-given"><div class="lbl">Total Given</div><div class="num" id="kGiven">—</div></div>
    <div class="kpi c-received"><div class="lbl">Total Received</div><div class="num" id="kReceived">—</div></div>
    <div class="kpi c-net"><div class="lbl">Net Balance</div><div class="num" id="kNet">—</div></div>
    <div class="kpi c-count"><div class="lbl">Transactions</div><div class="num" id="kCount">—</div></div>
  </div>

  <div class="toolbar">
    <div class="field">
      <label>Lender / Name</label>
      <select id="fName"><option value="">All</option></select>
    </div>
    <div class="field">
      <label>Type</label>
      <select id="fType">
        <option value="">All</option>
        <option value="Given">Given</option>
        <option value="Received">Received</option>
      </select>
    </div>
    <div class="field">
      <label>Search (Name)</label>
      <input type="text" id="fSearch" placeholder="e.g. Bholu, Papa, Anuj...">
    </div>
    <div class="countInfo" id="countInfo"></div>
  </div>

  <div class="panel">
    <table class="txn-table">
      <thead>
        <tr>
          <th data-key="date">Date <span class="arrow" id="arrow-date"></span></th>
          <th data-key="name">Name <span class="arrow" id="arrow-name"></span></th>
          <th data-key="type">Type <span class="arrow" id="arrow-type"></span></th>
          <th data-key="category">Category <span class="arrow" id="arrow-category"></span></th>
          <th data-key="notes">Notes <span class="arrow" id="arrow-notes"></span></th>
          <th data-key="amount" class="amtcol">Amount <span class="arrow" id="arrow-amount"></span></th>
        </tr>
      </thead>
      <tbody id="txnBody"></tbody>
    </table>
  </div>
</div>

<script>
const DATA_JSON_PATH = 'data.json';
const fmtINR = n => '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');

// Empty scaffold — used only if neither data.js nor data.json can be found. No
// fake/sample rows are shown; the table just displays an empty state.
const DEMO_FALLBACK = {"cashflow": []};

let ALL_TXNS = [];
let filtered = [];
let sortKey = 'date';
let sortDir = -1;

function showBanner(cls, html){
  const el = document.getElementById('dataStatus');
  el.className = 'data-status ' + cls;
  el.innerHTML = html;
}

function populateNameFilter(txns){
  const names = Array.from(new Set(txns.map(t=>t.name).filter(Boolean))).sort((a,b)=> a.localeCompare(b));
  const sel = document.getElementById('fName');
  names.forEach(n=>{
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });
}

function applyFilters(){
  const name = document.getElementById('fName').value;
  const type = document.getElementById('fType').value;
  const q = document.getElementById('fSearch').value.trim().toLowerCase();

  filtered = ALL_TXNS.filter(t=>{
    if(name && t.name !== name) return false;
    if(type && t.type !== type) return false;
    if(q){
      const hay = (t.name||'').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  sortFiltered();
  renderPage();
  renderKPIs();
}

function sortFiltered(){
  filtered.sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(sortKey === 'amount'){ av = Number(av)||0; bv = Number(bv)||0; }
    else { av = (av==null?'':String(av)).toLowerCase(); bv = (bv==null?'':String(bv)).toLowerCase(); }
    if(av < bv) return -1 * sortDir;
    if(av > bv) return 1 * sortDir;
    return 0;
  });
}

function renderKPIs(){
  let given=0, received=0;
  filtered.forEach(t=>{
    if(t.type === 'Given') given += Number(t.amount)||0;
    else if(t.type === 'Received') received += Number(t.amount)||0;
  });
  document.getElementById('kGiven').textContent = fmtINR(given);
  document.getElementById('kReceived').textContent = fmtINR(received);
  document.getElementById('kNet').textContent = fmtINR(given - received);
  document.getElementById('kCount').textContent = filtered.length.toLocaleString('en-IN');
}

function renderPage(){
  const body = document.getElementById('txnBody');
  const total = filtered.length;

  const netTotal = filtered.reduce((s,t)=> s + (t.type === 'Given' ? -1 : 1) * (Number(t.amount)||0), 0);
  const netCls = netTotal < 0 ? 'style="color:var(--red)"' : 'style="color:var(--green)"';
  document.getElementById('countInfo').innerHTML = total.toLocaleString('en-IN') + ' entr' + (total===1?'y':'ies') + ' matched · Net <span ' + netCls + '>' + (netTotal<0?'−':'+') + fmtINR(netTotal) + '</span>';

  if(!total){
    body.innerHTML = '<tr><td colspan="6" class="emptyRow">No entries match these filters</td></tr>';
    return;
  }

  body.innerHTML = filtered.map(t=>{
    const cls = t.type === 'Given' ? 'neg' : 'pos';
    const sign = t.type === 'Given' ? '−' : '+';
    return `<tr>
      <td>${t.date || '—'}</td>
      <td>${t.name || '—'}</td>
      <td><span class="type-pill ${t.type||''}">${t.type||'—'}</span></td>
      <td>${t.category || '—'}</td>
      <td>${t.notes || '—'}</td>
      <td class="amt ${cls}">${sign}${fmtINR(t.amount||0)}</td>
    </tr>`;
  }).join('');
}

document.getElementById('fName').addEventListener('change', applyFilters);
document.getElementById('fType').addEventListener('change', applyFilters);
document.getElementById('fSearch').addEventListener('input', applyFilters);

document.querySelectorAll('table.txn-table th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.getAttribute('data-key');
    if(sortKey === key){ sortDir *= -1; } else { sortKey = key; sortDir = key === 'date' ? -1 : 1; }
    document.querySelectorAll('.arrow').forEach(a=> a.textContent = '');
    document.getElementById('arrow-' + key).textContent = sortDir === 1 ? '▲' : '▼';
    sortFiltered();
    renderPage();
  });
});

function loadFrom(data, label, cls){
  ALL_TXNS = data.cashflow || [];
  const usingFallback = !(data.cashflow && data.cashflow.length);
  populateNameFilter(ALL_TXNS);
  showBanner(cls, label + (usingFallback ? ' <br><span style="opacity:.85">Note: this data.json doesn\'t have Cashflow data yet — re-generate it (Load Excel Workbook → push) on the dashboard.</span>' : ''));
  document.getElementById('arrow-date').textContent = '▼';
  applyFilters();
}

function initPage(){
  // Prefer data.js (window.EMBEDDED_DATA) — works over file:// as well as http(s) — then
  // fall back to fetching data.json (hosted only), then to the small built-in demo data.
  if(window.EMBEDDED_DATA && window.EMBEDDED_DATA.cashflow){
    loadFrom(window.EMBEDDED_DATA, '✅ Live data loaded from <b>data.js</b> — works the same whether this page is opened online or straight from disk.', 'live');
    return;
  }
  fetch(DATA_JSON_PATH, {cache:'no-store'})
    .then(r=> r.ok ? r.json() : Promise.reject(new Error('data.json not found (' + r.status + ')')))
    .then(json=>{
      if(!json) throw new Error('data.json is empty');
      loadFrom(json, '✅ Live data loaded from <b>data.json</b>.', 'live');
    })
    .catch(()=>{
      loadFrom(DEMO_FALLBACK, 'No data loaded — this page could not reach <code>data.js</code> or <code>data.json</code> yet.', 'demo');
    });
}

// ---- Password gate ----
// Client-side-only check (no server on GitHub Pages to authenticate against) — hides
// this page's UI from casual visitors, but data.json is still a public file at its URL.
// PASSWORD itself comes from auth-config.js (loaded in <head>) — that is the ONE
// place to edit if you want to change the password; see the comment in that file.
const PW_SESSION_KEY = 'financeLedger_unlocked';

function tryUnlock(){
  const input = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if(input.value === PASSWORD){
    sessionStorage.setItem(PW_SESSION_KEY, '1');
    document.getElementById('pwGate').remove();
    initPage();
  } else {
    err.textContent = 'Incorrect password — try again.';
    input.value = '';
    input.focus();
  }
}

document.getElementById('pwSubmit').addEventListener('click', tryUnlock);
document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') tryUnlock(); });

if(sessionStorage.getItem(PW_SESSION_KEY) === '1'){
  document.getElementById('pwGate').remove();
  initPage();
} else {
  document.getElementById('pwInput').focus();
}
</script>
</body>
</html>
